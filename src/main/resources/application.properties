spring.application.name=MahinPorteBosh
spring.config.import=optional:file:.env[.properties]
spring.mongodb.database=${MONGODB_DATABASE:mahin_porte_bosh}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mahin_porte_bosh}
server.port=${SERVER_PORT:${PORT:9091}}
server.address=0.0.0.0
server.error.include-message=never
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
