services:
  - type: web
    name: mahin-porte-bosh-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: mahin_porte_bosh
      - key: ALLOWED_ORIGINS
        value: https://mahinportebosh.vercel.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://mahinportebosh.vercel.app
